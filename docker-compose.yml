version: "3.8"

services:
  db:
    image: postgres:15
    container_name: netzplan_db
    environment:
      POSTGRES_USER: netzplan_user
      POSTGRES_PASSWORD: netzplan_pass
      POSTGRES_DB: netzplan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netzplan_backend
    environment:
      DATABASE_URL: postgresql://netzplan_user:netzplan_pass@db:5432/netzplan_db
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: